<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lead desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#E9EEF1;--card:#fff;--ink:#172026;--mute:#5B6B75;--line:#CBD5DB;--go:#0F7B5F;--hot:#C8321E;--warm:#D98E04;--cold:#2E6F9E;--cb:#6B5CA5;--none:#8A979F}
*{box-sizing:border-box}
body{margin:0;font:400 16px/1.45 'Schibsted Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:12px 16px}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.01em}
header p{margin:2px 0 0;font-size:13px;color:#B8C4CC}
.wrap{max-width:720px;margin:0 auto;padding:12px}
h2{font-size:18px;font-weight:800;margin:6px 0 10px}
.card{background:var(--card);border-radius:10px;padding:12px 14px;margin:0 0 10px;border-left:5px solid var(--none)}
.card.plain{border-left:0}
.t-hot{border-left-color:var(--hot)}.t-warm{border-left-color:var(--warm)}.t-cold{border-left-color:var(--cold)}.t-callback{border-left-color:var(--cb)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.name{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.sub{color:var(--mute);font-size:14px;overflow-wrap:anywhere}
.btn{min-height:44px;border:0;border-radius:8px;padding:0 16px;font:600 15px 'Schibsted Grotesk',system-ui,sans-serif;background:var(--go);color:#fff;cursor:pointer}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--hot)}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.5}
.btn:focus-visible,.chip:focus-visible,nav button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #1B6FD1;outline-offset:2px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:#fff;font:600 14px 'Schibsted Grotesk',system-ui,sans-serif;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tag{display:inline-block;font-size:13px;font-weight:600;padding:1px 9px;border-radius:10px;background:#E3E9ED;color:var(--ink)}
.tag.hot{background:var(--hot);color:#fff}.tag.warm{background:var(--warm);color:#fff}.tag.cold{background:var(--cold);color:#fff}.tag.callback{background:var(--cb);color:#fff}
.tag.flag{background:#FFF1C9}
input,textarea{width:100%;font:400 16px 'Schibsted Grotesk',system-ui,sans-serif;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:120px}
label{display:block;font-weight:600;font-size:14px;margin:10px 0 4px}
a{color:#1B5FA8}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav button{min-height:60px;border:0;background:none;font:600 14px 'Schibsted Grotesk',system-ui,sans-serif;color:var(--mute);cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--go)}
nav b{display:inline-block;min-width:20px;margin-left:4px;padding:0 5px;border-radius:10px;background:#E3E9ED;font-size:12px;line-height:20px;color:var(--ink)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#D5DEE3;margin:6px 0 4px}
.bar i{display:block;height:100%}
.legend{font-size:13px;color:var(--mute)}
audio{width:100%;margin:8px 0}
pre{white-space:pre-wrap;font:400 14px/1.5 'Schibsted Grotesk',system-ui,sans-serif;background:#F3F6F8;border-radius:8px;padding:10px;max-height:300px;overflow:auto;margin:6px 0}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
#toast{position:fixed;left:12px;right:12px;bottom:calc(80px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;background:var(--ink);color:#fff;padding:12px 14px;border-radius:8px;z-index:20;display:none}
#login{position:fixed;inset:0;background:var(--bg);z-index:30;display:none;align-items:center;justify-content:center;padding:20px}
#login .card{width:100%;max-width:380px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s}}
</style>
</head>
<body>
<header><h1>Lead desk</h1><p id="hstat">Loading</p></header>
<div class="wrap" id="main"></div>
<nav id="nav">
  <button data-act="tab" data-id="leads">Leads</button>
  <button data-act="tab" data-id="call">Call</button>
  <button data-act="tab" data-id="calls">Call log</button>
  <button data-act="tab" data-id="settings">Settings</button>
</nav>
<div id="toast" role="status"></div>
<div id="login"><div class="card plain">
  <h2>Sign in</h2>
  <label for="pw">Dashboard password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <p style="margin:12px 0 0"><button class="btn" data-act="login" style="width:100%">Sign in</button></p>
</div></div>

<script>
const TEMPS={hot:'Hot',warm:'Warm',cold:'Cold',callback:'Call back',do_not_call:'Do not call',not_picked:'Not picked',other:'Other'};
const TCOL={hot:'--hot',warm:'--warm',cold:'--cold',callback:'--cb',do_not_call:'--none',not_picked:'--line',other:'--none'};
let pw=localStorage.getItem('pw')||'';
let S={tab:'leads',leads:[],calls:[],auto:{},queue:0,lastFetch:null,lf:'new',cf:'all',open:null,settings:null,busy:false};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const when=t=>t?new Date(t).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
const dur=s=>s?Math.floor(s/60)+'m '+String(s%60).padStart(2,'0')+'s':'0s';
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4500)}

async function api(path,body){
  const r=await fetch('/api/'+path,{method:body?'POST':'GET',headers:{'content-type':'application/json','x-auth':pw},body:body?JSON.stringify(body):undefined});
  if(r.status===401){showLogin();throw new Error('Wrong or missing password')}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||'Request failed');
  return j;
}
function showLogin(){$('#login').style.display='flex'}

async function load(){
  const [l,c]=await Promise.all([api('leads'),api('calls')]);
  Object.assign(S,{leads:l.leads,auto:l.auto||{},queue:l.queue||0,lastFetch:l.lastFetch,calls:c.calls});
  render();
}

function render(){
  const newCount=S.leads.filter(l=>l.status==='new').length;
  document.querySelectorAll('nav button').forEach(b=>{
    b.classList.toggle('on',b.dataset.id===S.tab);
    if(b.dataset.id==='leads')b.innerHTML='Leads<b>'+newCount+'</b>';
    if(b.dataset.id==='calls')b.innerHTML='Call log<b>'+S.calls.length+'</b>';
    if(b.dataset.id==='call')b.innerHTML='Call'+(S.auto.running?'<b>live</b>':'');
  });
  const hot=S.calls.filter(c=>c.temperature==='hot').length;
  $('#hstat').textContent=newCount+' new leads, '+S.calls.length+' calls saved, '+hot+' hot';
  const v={leads:vLeads,call:vCall,calls:vCalls,settings:vSettings}[S.tab];
  $('#main').innerHTML=v();
}

/* ---------- Leads ---------- */
function vLeads(){
  const f=S.lf;
  const list=S.leads.filter(l=>f==='all'||(f==='new'&&l.status==='new')||(f==='called'&&['called','calling'].includes(l.status))||(f==='skipped'&&['skipped','error'].includes(l.status)));
  const lf=S.lastFetch?'Last run: '+S.lastFetch.added+' added, '+S.lastFetch.skippedAgencies+' agencies removed, '+(S.lastFetch.noPhone||0)+' without a phone, '+when(S.lastFetch.at):'No run yet. Leads arrive daily at about 9:00 AM IST.';
  let h='<div class="card plain"><div class="row"><div class="grow"><div class="name">Today\'s leads</div><div class="sub">'+esc(lf)+'</div></div>'+
    '<button class="btn" data-act="fetch" '+(S.busy?'disabled':'')+'>'+(S.busy?'Starting...':'Fetch leads now')+'</button></div></div>';
  h+='<div class="chips">'+[['new','New'],['called','Called'],['skipped','Skipped'],['all','All']].map(x=>'<button class="chip '+(f===x[0]?'on':'')+'" data-act="lf" data-id="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  if(!list.length)return h+'<div class="empty">No leads here yet. Tap "Fetch leads now". New leads show up after 5 to 15 minutes.</div>';
  h+=list.slice(0,150).map(l=>{
    const t=l.temperature&&l.status==='called'?' <span class="tag '+esc(l.temperature)+'">'+esc(TEMPS[l.temperature]||'')+'</span>':'';
    return '<div class="card"><div class="name">'+esc(l.name)+t+'</div>'+
      '<div class="sub">'+(l.jobTitle?'Hiring: '+(l.jobUrl?'<a href="'+esc(l.jobUrl)+'" target="_blank" rel="noopener">'+esc(l.jobTitle)+'</a>':esc(l.jobTitle)):esc(l.category))+(l.source?' on '+esc(l.source):'')+(l.city?' | '+esc(l.city):'')+'</div>'+
      '<div class="sub"><a href="tel:'+esc(l.phone)+'">'+esc(l.phone)+'</a> '+(l.website?'<a href="'+esc(l.website)+'" target="_blank" rel="noopener">website</a>':'<span class="tag flag">No website</span>')+'</div>'+
      (l.error?'<div class="sub" style="color:var(--hot)">'+esc(l.error)+'</div>':'')+
      '<div class="row" style="margin-top:8px">'+
      (l.status==='new'||l.status==='error'||l.status==='skipped'?'<button class="btn sm" data-act="aicall" data-id="'+esc(l.id)+'">Call with AI</button>':'<span class="tag">'+esc(l.status)+'</span>')+
      (l.status==='new'?'<button class="btn sm alt" data-act="skip" data-id="'+esc(l.id)+'">Skip</button>':'')+
      (l.status==='skipped'||l.status==='error'?'<button class="btn sm alt" data-act="unskip" data-id="'+esc(l.id)+'">Mark new</button>':'')+
      '</div></div>';
  }).join('');
  if(list.length>150)h+='<div class="empty">Showing 150 of '+list.length+'</div>';
  return h;
}

/* ---------- Call (dialer + auto) ---------- */
function vCall(){
  const a=S.auto||{};
  return '<h2>Call a number</h2><div class="card plain">'+
    '<label for="dp">Phone number</label><input id="dp" type="tel" inputmode="tel" placeholder="+91 98765 43210">'+
    '<label for="dn">Name (optional)</label><input id="dn" type="text" placeholder="Business or person">'+
    '<p style="margin:12px 0 0"><button class="btn" data-act="dial" style="width:100%">Call now with AI</button></p></div>'+
    '<h2>Auto-call</h2><div class="card plain">'+
    '<div class="name">'+(a.running?'Running':'Stopped')+'</div>'+
    '<div class="sub">'+esc(a.note||'Calls every new lead one by one, only between 10 AM and 7 PM IST.')+'</div>'+
    '<div class="sub">'+S.queue+' in queue | '+S.leads.filter(l=>l.status==='new').length+' new leads</div>'+
    '<p style="margin:12px 0 0">'+(a.running?'<button class="btn danger" data-act="autostop" style="width:100%">Stop auto-call</button>':'<button class="btn" data-act="autostart" style="width:100%">Start auto-call on all new leads</button>')+'</p></div>';
}

/* ---------- Call log ---------- */
function vCalls(){
  const all=S.calls;
  const cnt=k=>all.filter(c=>c.temperature===k).length;
  let h='<h2>Call log</h2>';
  if(all.length){
    h+='<div class="card plain"><div class="bar">'+Object.keys(TEMPS).map(k=>cnt(k)?'<i style="width:'+(cnt(k)/all.length*100)+'%;background:var('+TCOL[k]+')"></i>':'').join('')+'</div>'+
      '<div class="legend">'+Object.keys(TEMPS).filter(k=>cnt(k)).map(k=>TEMPS[k]+' '+cnt(k)).join(' | ')+'</div></div>';
  }
  h+='<div class="chips">'+[['all','All']].concat(Object.keys(TEMPS).map(k=>[k,TEMPS[k]])).map(x=>'<button class="chip '+(S.cf===x[0]?'on':'')+'" data-act="cf" data-id="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  const list=all.filter(c=>S.cf==='all'||c.temperature===S.cf);
  if(!list.length)return h+'<div class="empty">'+(all.length?'No calls in this group.':'No calls saved yet. Every call the assistant makes will appear here with its recording.')+'</div>';
  return h+list.map(c=>{
    const o=S.open===c.id;
    let d='';
    if(o){
      d+=(c.recordingUrl?'<audio controls preload="none" src="'+esc(c.recordingUrl)+'"></audio>':'<div class="sub">No recording for this call.</div>')+
        (c.summary?'<p style="margin:6px 0"><b>Summary:</b> '+esc(c.summary)+'</p>':'')+
        (c.reason?'<p style="margin:6px 0"><b>Why '+esc((TEMPS[c.temperature]||'').toLowerCase())+':</b> '+esc(c.reason)+'</p>':'')+
        (c.nextStep?'<p style="margin:6px 0"><b>Next step:</b> '+esc(c.nextStep)+'</p>':'')+
        '<div class="sub">Ended: '+esc(c.endedReason||'unknown')+'</div>'+
        '<div class="sub">'+[c.jobTitle?'Hiring: '+esc(c.jobTitle):'',c.source?'Source: '+esc(c.source):'',c.city?esc(c.city):'',c.address?esc(c.address):''].filter(Boolean).join(' | ')+'</div>'+
        '<div class="sub">'+(c.website?'<a href="'+esc(c.website)+'" target="_blank" rel="noopener">Website</a> ':'')+(c.email?'<a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a>':'')+'</div>'+
        (c.transcript?'<pre>'+esc(c.transcript)+'</pre>':'')+
        '<div class="row"><a class="btn sm alt" style="display:inline-flex;align-items:center;text-decoration:none" href="tel:'+esc(c.phone)+'">Call myself</a>'+
        '<a class="btn sm alt" style="display:inline-flex;align-items:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/'+esc(String(c.phone||'').replace(/\D/g,''))+'">WhatsApp</a>'+
        (c.leadId?'<button class="btn sm" data-act="aicall" data-id="'+esc(c.leadId)+'">Call again with AI</button>':'')+'</div>';
    }
    return '<div class="card t-'+esc(c.temperature)+'"><div class="row" data-act="open" data-id="'+esc(c.id)+'" style="cursor:pointer">'+
      '<div class="grow"><div class="name">'+esc(c.name)+'</div><div class="sub">'+esc(c.phone)+' | '+when(c.startedAt)+' | '+dur(c.durationSec)+'</div></div>'+
      '<span class="tag '+esc(c.temperature)+'">'+esc(TEMPS[c.temperature]||'Other')+'</span></div>'+
      (!o&&c.summary?'<div class="sub" style="margin-top:6px">'+esc(c.summary)+'</div>':'')+d+'</div>';
  }).join('');
}

/* ---------- Settings ---------- */
function vSettings(){
  const s=S.settings;
  if(!s){api('settings').then(x=>{S.settings=x;if(S.tab==='settings')render()}).catch(e=>toast(e.message));return '<div class="empty">Loading settings</div>'}
  return '<h2>Lead settings</h2><div class="card plain">'+
    '<label for="sn">Leads per day</label><input id="sn" type="number" min="1" max="300" value="'+esc(s.perDay)+'">'+
    '<label for="sc">Cities to search (one per line)</label><textarea id="sc">'+esc(s.cities.join('\n'))+'</textarea>'+
    '<label for="sk">Job titles to search (one per line)</label><textarea id="sk">'+esc(s.terms.join('\n'))+'</textarea>'+
    '<p class="sub">A business hiring for these roles on Indeed, Naukri or LinkedIn becomes a lead. Agencies, marketing, software, web and staffing companies are removed automatically.</p>'+
    '<p style="margin:12px 0 0"><button class="btn" data-act="savesettings" style="width:100%">Save settings</button></p></div>'+
    '<div class="card plain"><button class="btn alt" data-act="logout" style="width:100%">Sign out</button></div>';
}

/* ---------- Actions ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,id=b.dataset.id;
  try{
    if(a==='tab'){S.tab=id;render();window.scrollTo(0,0)}
    else if(a==='lf'){S.lf=id;render()}
    else if(a==='cf'){S.cf=id;render()}
    else if(a==='open'){S.open=S.open===id?null:id;render()}
    else if(a==='login'){pw=$('#pw').value;localStorage.setItem('pw',pw);$('#login').style.display='none';await load()}
    else if(a==='logout'){localStorage.removeItem('pw');pw='';location.reload()}
    else if(a==='fetch'){S.busy=true;render();try{await api('fetch-leads',{});toast('Started. New leads will appear here in 5 to 15 minutes.')}finally{S.busy=false}await load()}
    else if(a==='aicall'){b.disabled=true;await api('call',{leadId:id});toast('Calling now. The recording will appear in Call log when it ends.');await load()}
    else if(a==='skip'){await api('lead-update',{id,status:'skipped'});await load()}
    else if(a==='unskip'){await api('lead-update',{id,status:'new'});await load()}
    else if(a==='dial'){const number=$('#dp').value,name=$('#dn').value;await api('call',{number,name});toast('Calling '+number);await load()}
    else if(a==='autostart'){await api('auto',{op:'start'});toast('Auto-call started');await load()}
    else if(a==='autostop'){await api('auto',{op:'stop'});toast('Auto-call stopped');await load()}
    else if(a==='savesettings'){S.settings=await api('settings',{perDay:$('#sn').value,cities:$('#sc').value.split('\n'),terms:$('#sk').value.split('\n')});toast('Settings saved');render()}
  }catch(err){S.busy=false;render();toast(err.message)}
});
$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('[data-act=login]').click()});

if(!pw)showLogin();else load().catch(e=>{$('#hstat').textContent='Could not load';toast(e.message)});
setInterval(()=>{
  if(!pw||document.hidden||S.open)return;
  const ae=document.activeElement;if(ae&&/INPUT|TEXTAREA/.test(ae.tagName))return;
  if(S.tab==='settings')return;
  load().catch(()=>{});
},20000);
</script>
</body>
</html>
